    <!-- While the Screen (the main layout) is on its way, the page under it stays hidden behind a plain dark
         cover, so the first thing seen is the Screen itself, not the older page flashing by (Jeremy, 2026-10-06).
         screen/ui.js takes the cover off when the Screen opens, or when it will not open; the cover also lifts
         on its own after 12 seconds in case something fails to load. -->
    <style id="sc-boot-style">
      html.sc-boot, html.sc-boot body { background: #0f0f10; }
      html.sc-boot body > :not(.sc-page) { visibility: hidden; }
    </style>
    <script>
      (function () {
        try {
          var q = location.search;
          if (/[?&]screen=0\b/.test(q) || (navigator.webdriver && !/[?&]screen=1\b/.test(q))) return;
          var p = JSON.parse(localStorage.getItem("curiosities-screen-v1") || "null");
          if (p && p.open === false) return;
        } catch (e) {}
        var h = document.documentElement;
        h.classList.add("sc-boot");
        setTimeout(function () { h.classList.remove("sc-boot"); }, 12000);
      })();
    </script>

    <style id="workspaces-style">
      /* The bar: My film and Storyboard with the Library menu on the first row, then the workspaces in
         labelled sections (Camera, People, Look, Feeling, Comedy, Story) that wrap onto as many rows as needed. */
      .tabs { display: block; }
      .tabs-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .tabs-top .lib { margin-left: auto; }
      .tabs-ws { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; }
      .ws-sec { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 4px 6px 4px 8px; border-left: 3px solid var(--line); min-width: 0; max-width: 100%; }
      .ws-sec.is-comedy { border-left-color: var(--saffron); background: #fbe6d3; }
      .ws-group { flex: none; font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--saffron); margin-right: 2px; }
      .ws-sec.is-comedy .ws-group { color: var(--ink); font-weight: 500; }
      .tabs-ws button, .tabs-top button { flex: none; white-space: nowrap; }
      .lib { position: relative; flex: none; }
      .tabs #lib-btn::after { content: " ▾"; }
      .lib-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; width: 250px; max-width: calc(100vw - 32px); background: var(--panel); border: 3px solid var(--ink); box-shadow: 4px 4px 0 rgba(28, 23, 18, 0.25); display: grid; }
      .lib-menu[hidden] { display: none; }
      .tabs .lib-menu button { display: grid; text-align: left; border: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; background: none; white-space: normal; }
      .tabs .lib-menu button:last-child { border-bottom: 0; }
      .tabs .lib-menu button:hover, .tabs .lib-menu button:focus-visible { background: var(--ink); color: var(--paper); }
      .lib-menu small { font-family: var(--sans); font-size: 12px; text-transform: none; letter-spacing: 0; opacity: 0.75; }
      /* The workspaces live in a pop-up window, the Curiosity Browser, opened by its button in the top row (Jeremy,
         2026-10-06: the many-column list of words should not sit on the page; it is a pop-up like a search
         window). It has a search box; on a phone it is a sheet from the bottom instead. */
      .ws-pick { display: inline-flex; align-items: center; gap: 2px; }
      .ws-sheet-head { display: none; }
      .tabs .tabs-ws { display: none; }
      .tabs.ws-sheet-open .tabs-ws { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); align-items: start; gap: 8px 10px; position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 70; width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 96px); overflow-y: auto; margin: 0; padding: 0 16px 16px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 rgba(28, 23, 18, 0.25); }
      .tabs.ws-sheet-open .tabs-ws .ws-sheet-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 1; background: var(--paper); padding: 12px 0 10px; border-bottom: 1px solid var(--line); font-family: var(--serif); font-size: 17px; }
      .tabs.ws-sheet-open .tabs-ws .ws-sec { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
      .tabs.ws-sheet-open .tabs-ws .ws-sec button { white-space: normal; text-align: left; }
      .ws-find { flex: 1 1 auto; width: 0; min-width: 0; font: inherit; font-family: var(--sans); font-size: 14px; padding: 6px 10px; border: 2px solid var(--ink); background: #fff; }
      .ws-none { grid-column: 1 / -1; margin: 6px 0; font-family: var(--mono); font-size: 12px; color: #7a6f63; }
      .ws-sec[hidden], .tabs-ws button[hidden], .ws-none[hidden] { display: none !important; }
      .ws-sheet-back { position: fixed; inset: 0; z-index: 69; background: rgba(28, 23, 18, 0.35); }
      /* Viewer and Help ▸ App Walkthrough: buttons in the top row, moved into Library on phones so the row fits. */
      .tabs .lib-menu button.phone-only { display: none; }
      .ws-sheet-back[hidden] { display: none; }
      @media (max-width: 600px) {
        .tabs-top { flex-wrap: nowrap; gap: 5px; }
        .tabs-top > .cv-open-btn, .tabs-top > .cw-help { display: none; }
        .tabs .lib-menu button.phone-only { display: grid; }
        .tabs-top > button, .tabs-top .lib > button { font-size: 10px; letter-spacing: 0.04em; padding: 6px 7px; }
        .tabs .tabs-top .proj-ind { flex: none; font-size: 0; padding: 4px 6px; }
        .tabs .tabs-top .proj-ind::before { font-size: 12px; content: "●"; }
        .tabs .tabs-top .ws-pick { flex: 1 1 auto; min-width: 0; justify-content: center; }
        .ws-pick-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .tabs.ws-sheet-open .tabs-ws { display: flex; flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 6px; top: auto; left: 0; right: 0; bottom: 0; transform: none; width: auto; max-height: min(78vh, 640px); padding: 0 16px 18px; border: 0; border-top: 3px solid var(--ink); box-shadow: 0 -6px 0 rgba(28, 23, 18, 0.18); }
        .tabs.ws-sheet-open .tabs-ws .ws-sheet-head { padding: 12px 0 8px; gap: 8px; }
        .tabs.ws-sheet-open .tabs-ws .ws-sheet-head strong { display: none; }
        .tabs.ws-sheet-open .tabs-ws .ws-sec { flex-direction: row; flex-wrap: wrap; align-items: center; }
        .ws-sec { flex: none; padding: 3px 4px 3px 6px; gap: 5px; }
        .ws-group { width: 100%; }
        .tabs-ws .ws-sec button { font-size: 11px; letter-spacing: 0.04em; padding: 8px 9px; }
      }
      @media (max-width: 600px) {
        header.top { flex-direction: column; align-items: start; padding: 16px 16px 10px; }
        .tabs { padding: 10px 16px 0; }
        main { padding: 12px 16px 40px; }

      /* A workspace page */
      .ws { min-width: 0; }
      .ws h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; margin: 0 0 6px; }
      .ws h4 { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 0 4px; }
      .ws-jump { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 4px; font-family: var(--mono); font-size: 11px; }
      .ws-jump a { color: var(--saffron); }
      .ws-part { border-top: 2px solid var(--ink); padding-top: 10px; margin-top: 14px; min-width: 0; }
      .ws-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; margin: 6px 0; }
      .ws-row > label.field { margin: 0; min-width: 0; }
      .ws-step { display: inline-flex; align-items: center; gap: 8px; }
      .ws-step b { font-family: var(--mono); font-size: 14px; min-width: 2ch; text-align: center; }
      .ws-step button { width: 30px; height: 28px; padding: 0; font-size: 16px; }
      .ws-add { display: flex; gap: 6px; }
      .ws-add input { width: 130px; min-width: 0; }
      .ws-scroll { overflow-x: auto; max-width: 100%; }
      .ws-grid { border-collapse: collapse; font-size: 13px; }
      .ws-grid th, .ws-grid td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; text-align: left; }
      .ws-grid thead th { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
      .ws-grid tbody th { font-weight: 500; min-width: 120px; max-width: 220px; }
      .ws-grid td { min-width: 104px; }
      .ws-grid select, .ws-grid input { width: 100%; min-width: 92px; font-size: 13px; }
      .ws-now { display: block; font-family: var(--mono); font-size: 10px; color: var(--saffron); min-height: 0; }
      .ws-tag { font-family: var(--mono); font-size: 9px; text-transform: uppercase; color: #7a6f63; border: 1px solid var(--line); padding: 0 3px; }
      .ws-mini { margin-top: 10px; }
      .ws-mini .panel { flex: 0 0 180px; min-height: 0; }
      .ws-mini .balloon { font-size: 13px !important; }
      .ws-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 10px; align-items: start; }
      .ws-mod { min-width: 0; }
      .ws-mod.ws-flash { outline: 3px solid var(--saffron); outline-offset: 3px; }
      .ws-g { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--saffron); margin: 10px 0 4px; }
      .ws-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .ws-chips button { font-family: var(--mono); font-size: 11px; text-align: left; max-width: 100%; white-space: normal; }
      .ws-fallback { border: 1px dashed var(--saffron); background: #fff8ef; padding: 6px 8px; }
      .ws-matrix { margin-top: 10px; }
      .ws-all { margin-top: 10px; }
      .ws-all summary { cursor: pointer; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      .ws-tool { min-width: 0; max-width: 100%; }
      .ws-subtabs button { font-family: var(--mono); font-size: 11px; }
      /* Lens workspaces: the question, then each lens's main curiosity with its sliders under it. */
      .ws-question { font-family: var(--serif); font-size: 18px; line-height: 1.35; margin: 4px 0 8px; padding: 8px 12px; border-left: 4px solid var(--saffron); background: var(--panel); max-width: 62ch; }
      .ws-grid tr.ws-secrow th { background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
      .ws-grid tr.ws-main th { font-weight: 600; }
      .ws-grid tr.ws-sub th { padding-left: 18px; font-weight: 400; }
      .ws-lens { border-left: 3px solid var(--line); padding-left: 10px; margin: 10px 0; min-width: 0; }
      .ws-lens > h4 { margin-top: 4px; }
      .ws-lens .ws-q { margin: 0 0 6px; }
      .ws-sliders { margin-top: 8px; }
      #workspace .ws-sb .sb > h3:first-child { display: none; }
      /* Lens marks on a panel (app.js): the words for clothes, set and color under the stage drawing. */
      .lens-line { margin: -4px 0 0; font-family: var(--mono); font-size: 10px; line-height: 1.35; color: #3a3229; overflow-wrap: anywhere; }
      .lens-line span { display: inline; margin-right: 6px; }
      .lens-line b { color: var(--saffron); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 9px; }
      .stage.lensed { background: #fffaf2; height: auto; aspect-ratio: 200 / 90; }
      .sb-thumb .stage.lensed { height: 29px; aspect-ratio: auto; }
