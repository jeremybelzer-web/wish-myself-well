<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curiosities — storyboard board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p>Wish Myself Well · a tool, also a product</p>
        <h1>Curiosities</h1>
        <p>
          Change a measurable thing about a scene and the storyboard changes.
          The same shop exists inside Season 5. Ida builds it. We build it here.
        </p>
      </div>
      <p><a href="../../web/index.html#skits/5">Back to Book 05</a></p>
    </header>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="board" class="on">Board</button>
      <button type="button" data-tab="study">Study</button>
      <button type="button" data-tab="play">Play</button>
      <button type="button" data-tab="catalog">Catalog</button>
      <button type="button" data-tab="reference">Ensembles</button>
    </nav>
    <main class="layout">
      <section class="controls" id="controls"></section>
      <section class="board" id="board"></section>
      <section class="catalog hidden" id="catalog" style="grid-column: 1 / -1"></section>
      <section class="ref hidden" id="ref" style="grid-column: 1 / -1"></section>
      <section class="study hidden" id="study" style="grid-column: 1 / -1"></section>
      <section class="study play hidden" id="play" style="grid-column: 1 / -1"></section>
    </main>
    <script src="catalog.js"></script>
    <script src="library.js"></script>
    <script src="model.js"></script>
    <script src="reference.js"></script>
    <script src="app.js"></script>
    <script src="study.js"></script>
    <script src="play.js"></script>
  </body>
</html>
