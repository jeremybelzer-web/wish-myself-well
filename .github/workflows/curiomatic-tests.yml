name: Curiomatic tests
on:
  push:
    branches: ["curiosities-*"]
    paths: ["apps/curiosities/**", ".github/workflows/curiomatic-tests.yml"]
  pull_request:
    paths: ["apps/curiosities/**", ".github/workflows/curiomatic-tests.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/curiosities
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund
      - name: Desktop bridge packages (the Electron binary is not needed for the tests)
        run: npm install --no-audit --no-fund --ignore-scripts
        working-directory: apps/curiosities/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - run: node tests/run-all.js --browser
